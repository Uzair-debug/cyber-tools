name = "cyber-tools-portal"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat_v2"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Per-IP rate limits for the API routes (src/lib/rate-limit.ts).
# Approximate and counted per Cloudflare location; period must be 10 or 60 seconds.
[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "4721"
simple = { limit = 30, period = 60 }

# Stricter limit for requests that fan out to many targets or probe caller-chosen hosts
# (batch link checks, /api/ip port probes, /api/ssl)
[[ratelimits]]
name = "HEAVY_RATE_LIMITER"
namespace_id = "4722"
simple = { limit = 5, period = 60 }
